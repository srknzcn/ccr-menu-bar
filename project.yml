name: CCRMenuBar
options:
  bundleIdPrefix: com.ccr
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1

targets:
  CCRMenuBar:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
        product: Sparkle
    sources:
      - path: CCRMenuBar
        excludes:
          - "Resources/**"
      - path: CCRMenuBar/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccr.menubar
        PRODUCT_NAME: "CCR Menu Bar"
        INFOPLIST_FILE: CCRMenuBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: CCRMenuBar/CCRMenuBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
